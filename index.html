<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات نافس والقدرات والتحصيلي - مدارس الشارقة الأهلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- MathLive: كاتب ومعالج المعادلات البصري التفاعلي -->
    <link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css">
    <script src="https://unpkg.com/mathlive"></script>

    <style>
        :root {
            --purple-primary: #8A2BE2;
            --purple-dark: #3D0B37;
            --pink-accent: #E5007D;
            --skyblue-accent: #00AEEF;
            --gold-accent: #F3AC10;
            --bg-light: #F8F9FA;
            --card-shadow: 0 8px 24px rgba(61, 11, 55, 0.08);
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-light); color: #333; direction: rtl; min-height: 100vh; }

        header {
            background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-primary) 50%, var(--skyblue-accent) 100%);
            color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; gap: 10px;
        }

        .logo-title { font-size: 20px; color: var(--gold-accent); font-weight: bold; }
        .tagline { font-size: 12px; color: var(--skyblue-accent); font-weight: bold; }

        .role-btn { padding: 8px 18px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; color: white; background: transparent; transition: 0.3s; font-size: 0.9rem; }
        .role-btn.active { background: var(--pink-accent); }

        .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
        .card { background: white; padding: 22px; border-radius: 14px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .question-card { border-right: 6px solid var(--pink-accent); }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .option-btn { padding: 14px; border-radius: 8px; border: 1.5px solid #E2E8F0; background: white; text-align: right; cursor: pointer; font-size: 18px; min-height: 58px; display: flex; align-items: center; justify-content: flex-start; transition: 0.2s; }
        .option-btn.selected { border-color: var(--pink-accent); background: rgba(229, 0, 125, 0.08); font-weight: bold; }

        .btn-submit { width: 100%; padding: 14px; background: var(--pink-accent); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        select, input, textarea { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }

        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
        .filter-label { font-weight: bold; color: var(--purple-dark); font-size: 13px; }

        .q-image { max-height: 200px; width: auto; max-width: 100%; border-radius: 8px; margin: 12px 0; display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center; }
        .stat-box { padding: 20px; border-radius: 8px; background: #fff; border: 1px solid #eee; }

        math-field {
            display: block; width: 100%; padding: 10px; font-size: 22px; border: 2px solid var(--skyblue-accent); border-radius: 8px; background: #ffffff; margin-top: 5px; direction: ltr;
        }

        @media (max-width: 768px) {
            .options-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // دالة تحويل نصوص المعادلات المكتوبة عبر المحرر إلى صور CodeCogs رسمية
        const getCodeCogsUrl = (formula) => {
            if (!formula) return null;
            return `https://latex.codecogs.com/png.latex?\\dpi{150}\\huge%20${encodeURIComponent(formula)}`;
        };

        // بنك الأسئلة الأولي المخزن بالذاكرة
        const initialQuestions = [
            {
                id: 1,
                stage: 'ابتدائي',
                grade: 'الصف الثالث الابتدائي',
                testType: 'نافس',
                subject: 'رياضيات',
                questionText: 'ما الكسر الذي يمثل الجزء المظلل في الصورة التوضيحية؟',
                imageUrl: getCodeCogsUrl('\\dfrac{2}{4}'),
                options: ['1/4', '2/4', '3/4', '4/4'],
                correctAnswer: 1
            },
            {
                id: 2,
                stage: 'ثانوي',
                grade: 'الصف الثاني ثانوي',
                testType: 'قدرات',
                subject: 'كمي',
                questionText: 'أوجد قيمة المقدار الموضح في الشكل التالي:',
                imageUrl: getCodeCogsUrl('\\sqrt{81} + 2^3'),
                options: ['17', '15', '20', '25'],
                correctAnswer: 0
            }
        ];

        function App() {
            const [role, setRole] = useState('student');
            const [stage, setStage] = useState('ابتدائي');
            const [grade, setGrade] = useState('الصف الثالث الابتدائي');
            const [testType, setTestType] = useState('نافس');
            const [subject, setSubject] = useState('نموذج شامل');

            const [questionBank, setQuestionBank] = useState(initialQuestions);
            const [questions, setQuestions] = useState([]);
            const [userAnswers, setUserAnswers] = useState({});
            const [result, setResult] = useState(null);

            // لوحة المعلم
            const [qStage, setQStage] = useState('ثانوي');
            const [qGrade, setQGrade] = useState('الصف الثالث ثانوي');
            const [qTestType, setQTestType] = useState('تحصيلي');
            const [qSubject, setQSubject] = useState('رياضيات');
            const [qText, setQText] = useState('');
            const [qLatex, setQLatex] = useState('');
            const [qImageUrl, setQImageUrl] = useState('');
            const [options, setOptions] = useState(['', '', '', '']);
            const [correctIndex, setCorrectIndex] = useState(0);

            const mathFieldRef = useRef(null);

            const gradesByStage = {
                'ابتدائي': ['الصف الثالث الابتدائي', 'الصف السادس الابتدائي'],
                'ثانوي': ['الصف الثاني ثانوي', 'الصف الثالث ثانوي']
            };

            const testsByGrade = {
                'الصف الثالث الابتدائي': ['نافس'],
                'الصف السادس الابتدائي': ['نافس'],
                'الصف الثاني ثانوي': ['قدرات'],
                'الصف الثالث ثانوي': ['قدرات', 'تحصيلي']
            };

            const subjectsByTest = {
                'الصف الثالث الابتدائي_نافس': ['نموذج شامل', 'رياضيات', 'قراءة'],
                'الصف السادس الابتدائي_نافس': ['نموذج شامل', 'رياضيات', 'علوم', 'قراءة'],
                'الصف الثاني ثانوي_قدرات': ['نموذج شامل', 'كمي', 'لفظي'],
                'الصف الثالث ثانوي_قدرات': ['نموذج شامل', 'كمي', 'لفظي'],
                'الصف الثالث ثانوي_تحصيلي': ['نموذج شامل', 'فيزياء', 'كيمياء', 'أحياء وعلم بيئة', 'رياضيات']
            };

            const handleStageChange = (e) => {
                const st = e.target.value; setStage(st);
                const fg = gradesByStage[st][0]; setGrade(fg);
                const ft = testsByGrade[fg][0]; setTestType(ft); setSubject('نموذج شامل');
            };

            const handleGradeChange = (e) => {
                const gr = e.target.value; setGrade(gr);
                const ft = testsByGrade[gr][0]; setTestType(ft); setSubject('نموذج شامل');
            };

            // تصفية الأسئلة للطلاب
            useEffect(() => {
                let filtered = questionBank;
                if (stage) filtered = filtered.filter(q => q.stage === stage);
                if (grade) filtered = filtered.filter(q => q.grade === grade);
                if (testType) filtered = filtered.filter(q => q.testType === testType);
                if (subject && subject !== 'نموذج شامل') {
                    filtered = filtered.filter(q => q.subject === subject);
                }
                setQuestions(filtered);
                setUserAnswers({});
                setResult(null);
            }, [stage, grade, testType, subject, questionBank]);

            // تفعيل كاتب المعادلات للمعلم
            useEffect(() => {
                const mf = mathFieldRef.current;
                if (mf) {
                    const handleInput = () => setQLatex(mf.value);
                    mf.addEventListener('input', handleInput);
                    return () => mf.removeEventListener('input', handleInput);
                }
            }, [role]);

            const submitQuiz = () => {
                let score = 0;
                const total = questions.length;

                questions.forEach(q => {
                    if (userAnswers[q.id] === q.correctAnswer) score += 1;
                });

                setResult({
                    score,
                    total,
                    percentage: total > 0 ? Math.round((score / total) * 100) : 0
                });
            };

            const handleAddQuestionSubmit = (e) => {
                e.preventDefault();
                let finalImageUrl = qImageUrl;
                if (qLatex && qLatex.trim() !== '') {
                    finalImageUrl = getCodeCogsUrl(qLatex);
                }

                const newQ = {
                    id: questionBank.length + 1,
                    stage: qStage,
                    grade: qGrade,
                    testType: qTestType,
                    subject: qSubject,
                    questionText: qText,
                    imageUrl: finalImageUrl || null,
                    options: options,
                    correctAnswer: parseInt(correctIndex)
                };

                setQuestionBank([...questionBank, newQ]);
                alert('تمت إضافة السؤال والمعادلة المصورة بنجاح إلى المنصة!');
                setQText(''); setQLatex(''); setQImageUrl(''); setOptions(['', '', '', '']);
                if (mathFieldRef.current) mathFieldRef.current.value = '';
            };

            const availableSubjects = subjectsByTest[`${grade}_${testType}`] || ['نموذج شامل'];

            return (
                <div>
                    <header>
                        <div>
                            <div className="logo-title">مدارس الشارقة الأهلية</div>
                            <div className="tagline">وصلنا... ومكملين | منصة نافس والقدرات والتحصيلي</div>
                        </div>
                        <div>
                            <button className={`role-btn ${role==='student'?'active':''}`} onClick={()=>setRole('student')}>الطالب</button>
                            <button className={`role-btn ${role==='teacher'?'active':''}`} onClick={()=>setRole('teacher')}>المعلم</button>
                            <button className={`role-btn ${role==='admin'?'active':''}`} onClick={()=>setRole('admin')}>المدير (Admin)</button>
                        </div>
                    </header>

                    <div className="container">
                        {/* لوحة الطالب */}
                        {role === 'student' && (
                            <div>
                                <div className="card">
                                    <h3 style={{marginTop:0, color:'var(--purple-dark)'}}>اختيار نوع الاختبار</h3>
                                    <div style={{display:'flex', gap:'15px', flexWrap:'wrap', marginTop:'10px'}}>
                                        <div className="filter-group"><span className="filter-label">1. المرحلة</span><select value={stage} onChange={handleStageChange}><option value="ابتدائي">المرحلة الابتدائية</option><option value="ثانوي">المرحلة الثانوية</option></select></div>
                                        <div className="filter-group"><span className="filter-label">2. الصف الدراسي</span><select value={grade} onChange={handleGradeChange}>{gradesByStage[stage].map(g => <option key={g} value={g}>{g}</option>)}</select></div>
                                        <div className="filter-group"><span className="filter-label">3. نوع الاختبار</span><select value={testType} onChange={e=>{setTestType(e.target.value); setSubject('نموذج شامل');}}>{testsByGrade[grade].map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                                        <div className="filter-group"><span className="filter-label">4. المادة / القسم</span><select value={subject} onChange={e => setSubject(e.target.value)}>{availableSubjects.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                    </div>
                                </div>

                                {questions.map((q, idx) => (
                                    <div key={q.id} className="card question-card">
                                        <h4 style={{marginTop:0, color:'var(--purple-dark)', fontSize:'18px'}}>
                                            س{idx+1}: {q.questionText}
                                        </h4>
                                        {q.imageUrl && <img src={q.imageUrl} alt="معادلة/صورة السؤال" className="q-image" />}
                                        <div className="options-grid">
                                            {q.options.map((opt, oIdx) => (
                                                <button key={oIdx} className={`option-btn ${userAnswers[q.id]===oIdx?'selected':''}`} onClick={()=>setUserAnswers({...userAnswers, [q.id]: oIdx})}>
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}

                                {questions.length > 0 && <button className="btn-submit" onClick={submitQuiz}>تسليم الورقة وتصحيح المحاولة</button>}

                                {result && (
                                    <div className="card" style={{borderTop:'5px solid var(--gold-accent)', marginTop:'20px'}}>
                                        <h3 style={{color:'var(--purple-dark)', marginTop:0}}>نتيجة المحاولة</h3>
                                        <p style={{fontSize:'22px'}}>النسبة المئوية: <strong style={{color:'var(--pink-accent)'}}>{result.percentage}%</strong></p>
                                        <p>الإجابات الصحيحة: {result.score} من أصل {result.total}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* لوحة المعلم */}
                        {role === 'teacher' && (
                            <div className="card">
                                <h3 style={{color:'var(--purple-dark)', marginTop:0}}>لوحة المعلم - كاتب المعادلات التفاعلي المباشر</h3>
                                <form onSubmit={handleAddQuestionSubmit}>
                                    <div style={{display:'flex', gap:'10px', flexWrap:'wrap', margin:'15px 0'}}>
                                        <div className="filter-group"><label className="filter-label">المرحلة</label><select value={qStage} onChange={e=>setQStage(e.target.value)}><option value="ابتدائي">ابتدائي</option><option value="ثانوي">ثانوي</option></select></div>
                                        <div className="filter-group"><label className="filter-label">الصف</label><select value={qGrade} onChange={e=>setQGrade(e.target.value)}><option value="الصف الثالث الابتدائي">الصف الثالث الابتدائي</option><option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option><option value="الصف الثاني ثانوي">الصف الثاني ثانوي</option><option value="الصف الثالث ثانوي">الصف الثالث ثانوي</option></select></div>
                                        <div className="filter-group"><label className="filter-label">نوع الاختبار</label><select value={qTestType} onChange={e=>setQTestType(e.target.value)}><option value="نافس">نافس</option><option value="قدرات">قدرات</option><option value="تحصيلي">تحصيلي</option></select></div>
                                        <div className="filter-group"><label className="filter-label">المادة</label><input type="text" value={qSubject} onChange={e=>setQSubject(e.target.value)} placeholder="مثال: رياضيات..." required /></div>
                                    </div>

                                    <div style={{marginBottom:'15px'}}>
                                        <label className="filter-label">نص السؤال:</label>
                                        <textarea style={{width:'100%', height:'60px', marginTop:'5px'}} value={qText} onChange={e=>setQText(e.target.value)} placeholder="اكتب نص السؤال..." required />
                                    </div>

                                    <div style={{marginBottom:'15px'}}>
                                        <label className="filter-label" style={{color:'var(--pink-accent)'}}>🎨 اكتب أو ارسم المعادلة هنا بلمسة زر (كاتب معادلات تفاعلي):</label>
                                        <math-field ref={mathFieldRef}></math-field>
                                        <span style={{fontSize:'12px', color:'#666'}}>* اضغط على المربع الملون بالأزرق لتستعرض لوحة أزرار الكسور والجذور والجبر تلقائياً!</span>
                                    </div>

                                    <div style={{marginBottom:'15px'}}>
                                        <label className="filter-label">أو أدرج رابط صورة خارجية (اختياري):</label>
                                        <input style={{width:'100%', marginTop:'5px'}} type="text" value={qImageUrl} onChange={e=>setQImageUrl(e.target.value)} placeholder="https://..." />
                                    </div>

                                    <div style={{marginBottom:'15px'}}>
                                        <label className="filter-label">خيارات الإجابة:</label>
                                        {options.map((opt, i) => (
                                            <div key={i} style={{display:'flex', alignItems:'center', gap:'10px', marginTop:'8px'}}>
                                                <input type="radio" name="correct" checked={correctIndex === i} onChange={()=>setCorrectIndex(i)} />
                                                <input style={{flex:1}} type="text" value={opt} onChange={e=>{
                                                    const copy = [...options]; copy[i] = e.target.value; setOptions(copy);
                                                }} placeholder={`الخيار ${i+1}`} required />
                                            </div>
                                        ))}
                                    </div>

                                    <button className="btn-submit" type="submit">حفظ السؤال ورسم المعادلة بنجاح</button>
                                </form>
                            </div>
                        )}

                        {/* لوحة المدير */}
                        {role === 'admin' && (
                            <div className="card">
                                <h3 style={{color:'var(--purple-dark)', marginTop:0}}>لوحة الإدارة الرئيسية (Admin Dashboard)</h3>
                                <div className="stats-grid" style={{marginTop:'15px'}}>
                                    <div className="stat-box"><h4 style={{margin:0}}>إجمالي الأسئلة</h4><p style={{fontSize:'28px', color:'var(--pink-accent)', fontWeight:'bold'}}>{questionBank.length}</p></div>
                                    <div className="stat-box"><h4 style={{margin:0}}>الصفوف المفعّلة</h4><p style={{fontSize:'28px', color:'var(--purple-dark)', fontWeight:'bold'}}>4 صفوف</p></div>
                                    <div className="stat-box"><h4 style={{margin:0}}>حالة النظام</h4><p style={{fontSize:'22px', color:'green', fontWeight:'bold'}}>نشط ومستقر 100%</p></div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
